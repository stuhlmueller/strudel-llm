packages:
  - packages/*
  - examples/*
  - tools/dbpatch
  - website/

allowBuilds:
  '@serialport/bindings-cpp': true
  esbuild: true
  nx: true
  sharp: true
  tree-sitter: true
  tree-sitter-cli: true
  tree-sitter-haskell: true

minimumReleaseAgeExclude:
  - globals@17.8.0

peerDependencyRules:
